name: Bump formula

on:
  # Trigger from the main canonry repo's publish workflow via repository_dispatch
  # (event_type: "canonry-published", client_payload: { version: "4.133.4" }).
  repository_dispatch:
    types: [canonry-published]
  # Manual fallback — pass the version explicitly.
  workflow_dispatch:
    inputs:
      version:
        description: "Canonry version to bump to (e.g. 4.133.4)"
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ github.event.client_payload.version || inputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version provided"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump formula
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_FETCH_RETRIES: 0
          NPM_CONFIG_FETCH_TIMEOUT: 10000
        run: |
          set -euo pipefail
          PACKAGE="@canonry/canonry@$VERSION"
          TARBALL_URL=""

          # npm can accept a scoped publish while its public metadata and
          # tarball remain unavailable for several minutes. Resolve the
          # canonical tarball URL from npm and wait up to ten minutes.
          for attempt in {1..60}; do
            candidate="$(npm view "$PACKAGE" dist.tarball 2>/dev/null || true)"
            if [[ "$candidate" == https://registry.npmjs.org/* ]] && \
              curl -fsSL --connect-timeout 5 --max-time 30 -o /tmp/canonry.tgz "$candidate"; then
              TARBALL_URL="$candidate"
              break
            fi

            echo "$PACKAGE is still processing (attempt $attempt/60)"
            if [[ "$attempt" -lt 60 ]]; then
              sleep 10
            fi
          done

          if [[ -z "$TARBALL_URL" || ! -s /tmp/canonry.tgz ]]; then
            echo "::error::$PACKAGE was not publicly available after 10 minutes"
            exit 1
          fi

          SHA256=$(sha256sum /tmp/canonry.tgz | awk '{print $1}')
          echo "version=$VERSION sha256=$SHA256"

          # Update url + sha256 in place. Homebrew derives the version from
          # the URL filename, so no separate version line is required.
          # `|` as the sed delimiter avoids escaping `/` in the URL.
          sed -i "s|^  url \".*\"|  url \"${TARBALL_URL}\"|" Formula/canonry.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" Formula/canonry.rb

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet Formula/canonry.rb; then
            echo "Formula already at $VERSION — nothing to do"
            exit 0
          fi

          git add Formula/canonry.rb
          git commit -m "canonry $VERSION"
          git push origin HEAD:main
